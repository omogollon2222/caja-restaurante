<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurante</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="backend.js?v=9"></script>
<style>
:root{
  --bg:#f5f7ee;--surface:#fff;--surface-2:#e5eed8;--line:#d3dfc2;
  --ink:#1e2a1b;--ink-2:#5e4a2c;--ink-3:#857a5e;
  --accent:#00984a;--accent-ink:#fff;--accent-soft:#d6efdf;--bad:#d7141e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111811;--surface:#19231a;--surface-2:#223024;--line:#33452f;
  --ink:#eef4e6;--ink-2:#d9cba8;--ink-3:#a99e80;
  --accent:#3ccf7a;--accent-ink:#04140a;--accent-soft:#173a25;--bad:#ff7b72;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ingreso */
.gate{flex:1;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 1px 2px rgba(50,70,30,.06),0 12px 32px rgba(50,70,30,.10);width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#8cc63f);display:grid;place-items:center;font-size:24px}
.logo{display:block;width:96px;height:96px;border-radius:50%;object-fit:contain;background:#fff;box-shadow:0 2px 10px rgba(50,70,30,.15)}
.card .logo{align-self:center}
.who .logo{width:44px;height:44px;flex:none;box-shadow:0 1px 4px rgba(50,70,30,.18)}
.card h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;line-height:1.1}
.card p{margin:0;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:linear-gradient(135deg,var(--accent),#43b649);border-color:var(--accent);color:var(--accent-ink);padding:12px;border-radius:12px;box-shadow:0 4px 14px rgba(0,152,74,.25)}
.btn:disabled{opacity:.5;cursor:wait}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-align:left}
.msg{font-size:14px;min-height:20px;color:var(--ink-2)}
.modo{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.modo button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--ink-2)}
.modo button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#mPin,#mCorreo{display:flex;flex-direction:column;gap:12px}
#mPin[hidden],#mCorreo[hidden]{display:none}
.puestos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.puestos button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px}
.puestos button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pin{font-size:26px;letter-spacing:.4em;text-align:center;font-family:ui-monospace,Menlo,monospace}
.codigo{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.msg.err{color:var(--bad)}

/* app */
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:3px solid var(--accent);background:var(--bg);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.who .mark{width:34px;height:34px;border-radius:10px;font-size:18px;flex:none}
.who b{font-family:var(--display);font-weight:800;font-size:18px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--ink-3);font-size:12px}
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (max-width:560px){
  .bar{gap:8px;padding:8px 12px}
  .tabs{order:3;width:100%}
  .tab{flex:1 0 auto}
}
</style>
</head>
<body>

<!-- Ingreso -->
<section class="gate" id="login" hidden>
  <form class="card" id="loginForm" novalidate>
    <div class="mark" id="loginMark" aria-hidden="true">🍽️</div>
    <img class="logo" id="loginLogo" alt="" hidden>
    <div><h1 id="appName">Restaurante</h1><p id="loginSub">Elige tu puesto y escribe tu PIN.</p></div>
    <div class="modo" role="tablist"><button type="button" data-m="pin" aria-pressed="true">Personal</button><button type="button" data-m="correo" aria-pressed="false">Dueño (correo)</button></div>
    <div id="mPin">
      <div class="codigo" id="codigoVer" hidden><span>Restaurante: <b id="codigoTxt"></b></span><button class="link" id="codigoCambiar" type="button">cambiar</button></div>
      <label class="field" id="codigoField"><span>Código del restaurante (te lo da el dueño)</span><input class="inp" id="codigo" autocomplete="off" autocapitalize="none" placeholder="ej. quintajosaid"></label>
      <div class="field"><span>Tu puesto</span><div class="puestos" id="puestos"></div></div>
      <label class="field"><span>PIN</span><input class="inp pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••"></label>
    </div>
    <div id="mCorreo" hidden>
      <label class="field"><span>Correo</span><input class="inp" id="email" type="email" autocomplete="username"></label>
      <label class="field"><span>Contraseña</span><input class="inp" id="pass" type="password" autocomplete="current-password"></label>
    </div>
    <button class="btn pri" id="enter" type="submit">Ingresar</button>
    <button class="link" id="forgot" type="button" hidden>Olvidé mi contraseña</button>
    <div class="msg" id="loginMsg" role="status"></div>
  </form>
</section>

<!-- Cuenta bloqueada -->
<section class="gate" id="blocked" hidden>
  <div class="card">
    <div class="mark" aria-hidden="true">🔒</div>
    <div><h1 id="blockTitle">Cuenta no activa</h1><p id="blockText"></p></div>
    <a class="btn pri" id="blockWa" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Escribir a soporte por WhatsApp</a>
    <button class="btn" id="blockOut" type="button">Salir</button>
  </div>
</section>

<!-- App -->
<header class="bar" id="bar" hidden>
  <div class="who"><div class="mark" id="barMark" aria-hidden="true">🍽️</div><img class="logo" id="barLogo" alt="" hidden><div style="min-width:0"><b id="rName">Restaurante</b><small id="rSub"></small></div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <button class="btn" id="logout" type="button">Salir</button>
</header>
<main class="frames" id="frames" hidden></main>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const auth = App.auth;
const name = window.APP_NOMBRE || "Restaurante";
document.title = name; $("#appName").textContent = name;

// Logo propio de cada restaurante: campo "logo" en restaurantes/{uid} (nombre del archivo en el repo o un link https).
// Se recuerda en este celular para mostrarlo también en la pantalla de ingreso.
function setLogo(src, alt){
  [["#loginLogo","#loginMark"],["#barLogo","#barMark"]].forEach(([img, mark]) => {
    const i = $(img);
    i.onerror = () => { i.hidden = true; $(mark).hidden = false; };
    if (src) { i.src = src; i.alt = alt || ""; }
    i.hidden = !src; $(mark).hidden = !!src;
  });
  if (src) $("#favicon").href = src;
}
let savedLogo = null; try { savedLogo = JSON.parse(localStorage.getItem("logo") || "null"); } catch {}
if (savedLogo && savedLogo.src) { setLogo(savedLogo.src, savedLogo.alt); if (savedLogo.alt) $("#appName").textContent = savedLogo.alt; }

function show(id){ ["login","blocked"].forEach(x => $("#"+x).hidden = x !== id); const app = id === "app"; $("#bar").hidden = !app; $("#frames").hidden = !app; }
function msg(t, err){ const m = $("#loginMsg"); m.textContent = t || ""; m.classList.toggle("err", !!err); }
const authErr = c => ({
  "auth/invalid-credential":"Correo o contraseña incorrectos.",
  "auth/wrong-password":"Correo o contraseña incorrectos.",
  "auth/user-not-found":"Correo o contraseña incorrectos.",
  "auth/invalid-email":"Revisa el correo: no tiene un formato válido.",
  "auth/too-many-requests":"Demasiados intentos. Espera unos minutos e inténtalo otra vez.",
  "auth/network-request-failed":"Sin conexión a internet. Revisa tu red."
})[c] || "No se pudo ingresar. Inténtalo otra vez.";

// ---------- ingreso: personal con puesto + PIN, o dueño con correo ----------
const PUESTOS = [["m1","Mesero 1"],["m2","Mesero 2"],["m3","Mesero 3"],["m4","Mesero 4"],["m5","Mesero 5"],["cocina","Cocina"],["caja","Caja"],["admin","Administrador"]];
let modo = "pin", puesto = "";
try { puesto = localStorage.getItem("puesto") || ""; } catch {}
let codigoGuardado = ""; try { codigoGuardado = localStorage.getItem("codigoRest") || ""; } catch {}
try { if (localStorage.getItem("modoIngreso") === "correo") modo = "correo"; } catch {}
$("#puestos").innerHTML = PUESTOS.map(([k, t]) => `<button type="button" data-p="${k}" aria-pressed="${k === puesto}">${t}</button>`).join("");
$("#puestos").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (!b) return; puesto = b.dataset.p; $("#puestos").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); $("#pin").focus(); });
function pintaCodigo(){ $("#codigoVer").hidden = !codigoGuardado; $("#codigoField").hidden = !!codigoGuardado; $("#codigoTxt").textContent = codigoGuardado; $("#codigo").value = codigoGuardado; }
$("#codigoCambiar").onclick = () => { codigoGuardado = ""; pintaCodigo(); $("#codigo").focus(); };
function setModo(m){
  modo = m; try { localStorage.setItem("modoIngreso", m); } catch {}
  document.querySelectorAll(".modo button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
  $("#mPin").hidden = m !== "pin"; $("#mCorreo").hidden = m !== "correo"; $("#forgot").hidden = m !== "correo";
  $("#loginSub").textContent = m === "pin" ? "Elige tu puesto y escribe tu PIN." : "Ingresa con el correo del dueño del restaurante.";
  msg("");
}
document.querySelector(".modo").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) setModo(b.dataset.m); });
pintaCodigo(); setModo(modo);
$("#pin").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  let email, pass;
  if (modo === "pin") {
    const codigo = App.limpiaCodigo(codigoGuardado || $("#codigo").value);
    const pin = $("#pin").value.trim();
    if (!codigo) { msg("Escribe el código del restaurante.", true); return; }
    if (!puesto) { msg("Elige tu puesto.", true); return; }
    if (!/^\d{1,6}$/.test(pin)) { msg("El PIN son números (hasta 6).", true); return; }
    email = App.correoPersonal(puesto, codigo); pass = App.clavePin(pin);
    try { localStorage.setItem("puesto", puesto); } catch {}
    $("#enter").disabled = true; msg("Ingresando…");
    try { await auth.signInWithEmailAndPassword(email, pass); try { localStorage.setItem("codigoRest", codigo); } catch {} codigoGuardado = codigo; msg(""); }
    catch (err) { msg(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(err.code) ? "PIN incorrecto, o ese puesto no tiene cuenta en este restaurante. Revisa el código del restaurante." : authErr(err.code), true); $("#pin").value = ""; }
    $("#enter").disabled = false;
    return;
  }
  email = $("#email").value.trim(); pass = $("#pass").value;
  if (!email || !pass) { msg("Escribe tu correo y contraseña.", true); return; }
  $("#enter").disabled = true; msg("Ingresando…");
  try { await auth.signInWithEmailAndPassword(email, pass); msg(""); }
  catch (err) { msg(authErr(err.code), true); }
  $("#enter").disabled = false;
});
$("#forgot").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if (!email) { msg("Escribe tu correo arriba y vuelve a tocar “Olvidé mi contraseña”.", true); return; }
  try { await auth.sendPasswordResetEmail(email); msg("Te enviamos un correo para crear una nueva contraseña."); }
  catch (err) { msg(authErr(err.code), true); }
});
const out = () => auth.signOut().then(() => { try { localStorage.removeItem("logo"); } catch {} location.reload(); });
$("#logout").onclick = out; $("#blockOut").onclick = out;

function block(title, text){
  $("#blockTitle").textContent = title; $("#blockText").textContent = text;
  const wa = window.APP_SOPORTE_WHATSAPP;
  $("#blockWa").hidden = !wa;
  if (wa) $("#blockWa").href = "https://wa.me/" + wa + "?text=" + encodeURIComponent("Hola, necesito ayuda con mi cuenta de " + name + " (" + (auth.currentUser && auth.currentUser.email) + ")");
  show("blocked");
}

// Pantallas según el rol de cada persona.
const PANT = {
  admin:   { t: "Resumen", f: "admin" },
  mesas:   { t: "Mesas", f: "mesas" },
  cocina:  { t: "Cocina", f: "cocina" },
  ventas:  { t: "Ventas", f: "ventas" },
  caja:    { t: "Caja", f: "caja" },
  clientes:{ t: "Clientes", f: "clientes" }
};
const POR_ROL = {
  admin:  ["admin", "mesas", "cocina", "ventas", "caja", "clientes"],
  caja:   ["mesas", "ventas", "caja", "clientes"],
  mesero: ["mesas"],
  cocina: ["cocina"]
};
const V = "?v=9";
const frames = {};
let permitidas = [];
function openFrame(key){
  if (!permitidas.includes(key)) key = permitidas[0];
  if (!frames[key]) {
    const f = document.createElement("iframe");
    f.name = "f-" + key; f.src = PANT[key].f + ".html" + V; f.title = PANT[key].t;
    f.setAttribute("allow", "clipboard-write; screen-wake-lock");
    $("#frames").appendChild(f); frames[key] = f;
  }
  Object.entries(frames).forEach(([k, f]) => f.hidden = k !== key);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.f === key)));
  try { localStorage.setItem("tab", key); } catch {}
}
document.querySelector("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) openFrame(t.dataset.f); });
const ROL_TXT = { admin: "Administrador", caja: "Caja", mesero: "Mesero", cocina: "Cocina" };

auth.onAuthStateChanged(async user => {
  if (!user) { show("login"); return; }
  const res = await App.resolveCtx(user);
  if (res.estado === "error") { block("No se pudo verificar tu cuenta", "Revisa tu conexión a internet e inténtalo de nuevo."); return; }
  if (res.estado !== "ok") { block("Cuenta no activa", "Tu usuario no está asignado a ningún restaurante. Si eres parte del personal, pide al dueño que cree tu puesto y PIN en Resumen → Personal."); return; }
  const ctx = res.ctx, r = ctx.r;
  const vence = App.vence(r);
  if (!vence || vence < new Date()) { block("Suscripción vencida", (ctx.dueno ? "Tu suscripción terminó" : "La suscripción del restaurante terminó") + (vence ? " el " + vence.toLocaleDateString("es") : "") + ". Renueva para seguir registrando ventas; los datos están guardados."); return; }
  $("#rName").textContent = r.nombre || user.email;
  document.title = r.nombre || name;
  const logo = typeof r.logo === "string" ? r.logo.trim() : "";
  setLogo(logo, r.nombre || "");
  try { localStorage.setItem("logo", JSON.stringify(logo ? { src: logo, alt: r.nombre || "" } : null)); } catch {}
  const dias = Math.ceil((vence - new Date()) / 864e5);
  $("#rSub").textContent = (ctx.dueno ? "" : ctx.nombre + " · ") + (ctx.dueno ? "Dueño" : ROL_TXT[ctx.rol] || ctx.rol) + (dias <= 7 && ctx.dueno ? " · vence en " + dias + (dias === 1 ? " día" : " días") : "");
  permitidas = POR_ROL[ctx.rol] || ["mesas"];
  $("#tabs").innerHTML = permitidas.map(k => `<button class="tab" role="tab" data-f="${k}" aria-selected="false">${PANT[k].t}</button>`).join("");
  $("#tabs").hidden = permitidas.length < 2;
  show("app");
  let last = permitidas[0]; try { last = localStorage.getItem("tab") || last; } catch {}
  openFrame(last);
});
})();
</script>
</body>
</html>
